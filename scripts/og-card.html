<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG card</title>
<style>
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; src: url("../assets/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #f6f4ef; color: #17150f; font-family: "Schibsted Grotesk", sans-serif; position: relative; overflow: hidden; }
.wrap { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
.eyebrow { font-size: 24px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: #b93d12; }
h1 { font-size: 92px; line-height: .98; letter-spacing: -0.04em; margin: 28px 0 26px; font-weight: 760; max-width: 760px; }
h1 span { color: #e2581f; }
p { font-size: 32px; line-height: 1.35; color: #4b473f; margin: 0; max-width: 700px; }
.url { margin-top: auto; font-size: 26px; font-weight: 600; color: #17150f; }
.bars { position: absolute; right: 80px; top: 150px; width: 300px; display: grid; gap: 22px; }
.bars div { height: 44px; border-radius: 0 10px 10px 0; background: #d8d2c4; }
.bars div:nth-child(1) { width: 100%; background: #e2581f; }
.bars div:nth-child(2) { width: 76%; }
.bars div:nth-child(3) { width: 58%; }
.bars div:nth-child(4) { width: 40%; }
.rule { position: absolute; right: 380px; top: 130px; bottom: 150px; border-left: 3px solid #17150f; }
</style></head>
<body>
<div class="rule"></div>
<div class="bars"><div></div><div></div><div></div><div></div></div>
<div class="wrap">
  <div class="eyebrow">Data Analyst · BI Analyst · Stockholm</div>
  <h1>Gazi Shafayet Hossain<span>.</span></h1>
  <p>SQL, Excel and Looker Studio at work. MSc in Data Science, Statistics and Decision Analysis.</p>
  <div class="url">gazish.github.io</div>
</div>
</body></html>
